name: tacotron2-ljspeech reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag.
#
# Row-specific additions on top of the generated file, all in the untraced setup
# stage, each explained at its own line below:
#   (a) the provenance CLI is installed by NAME AND VERSION from a public index
#       and verified by wheel sha256, not fetched from a presigned URL;
#   (b) this repository's dependencies are installed with FOUR VERSION CEILINGS,
#       every one of which is forced by a specific upstream line of code -- see
#       the block at (b) and repro/preflight_cpu.py, which proves each of them on
#       CPU in a few seconds;
#   (c) four pre-flight gates run before anything is paid for: upstream files
#       unmodified, environment recordable as a portable freeze, upstream's
#       2019-era API calls actually resolving, and the native (non-pip) library
#       boundary reported with dpkg ownership.
#
# WHY THERE IS NO EXPERIMENT-TRACKER FLAG ANYWHERE IN THIS FILE.
# This repository ships no experiment logging that any bridge can serve.
# `grep -ri 'wandb\|mlflow\|comet\|neptune'` over the whole tree returns nothing.
# What it does ship is TensorBoard, and it is genuinely wired up rather than
# vestigial: logger.py subclasses `torch.utils.tensorboard.SummaryWriter` and
# train.py calls `log_training` every iteration (train.py:242) and
# `log_validation` at every checkpoint (train.py:147), writing scalars,
# per-parameter histograms and three matplotlib figures. Those event files are
# produced by this run and are part of the published artefact directory.
# TensorBoard is NOT bridged to trackio, so no experiment URL can be produced
# from it, and adding a `wandb.init()` call to train.py to manufacture one would
# modify the workload -- the exact thing that would make this row a demo of our
# patch instead of a reproduction of NVIDIA's work. So `--wandb-to-trackio` and
# `TRACKIO_SPACE_ID` are deliberately ABSENT from the two run stages below, and
# the row publishes `experimentUrl: null` with that reason stated.

secrets:
  - HF_TOKEN            # roar put upload (the corpus is fetched anonymously)

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -c "import sys; print('python', sys.version)"
    python -m pip install --quiet requests || true
    rm -rf *.egg-info src/*.egg-info
    df -h / | tail -1
    # ---- self-terminating watchdog, sized from a measurement --------------
    # Expectation for this run is ~30 minutes, from measurements taken on CPU
    # before booking this host: provisioning and setup ~7 (the dependency install
    # below is ~15 wheels), fetch ~9 (2.6 GB download, a 2.6 GB sha256 measured at
    # 25s, and a 13100-file bzip2 extraction measured at 636s on a contended
    # 4-core box), train ~9 (101 optimiser steps; the dataset side is measured at
    # 0.015s per utterance so the GPU decoder dominates, plus two full validation
    # passes over the 100-utterance validation filelist), label and publish ~4 (a
    # ~340 MB checkpoint upload). The watchdog is 2x that. It is a backstop
    # against an operator or a job runner that dies holding a live GPU, not a step
    # timeout: if the run finishes normally the host is torn down long before this
    # fires.
    sudo shutdown -h +60 || true
    echo "watchdog: halt scheduled at +60 min (2x the 30-min measured expectation)"
    # ---- make the fork URL explicit on `origin` before anything is recorded --
    # Reproducing this row means cloning the remote recorded in its lineage, so
    # the recorded value has to be a URL a stranger can actually fetch. A
    # `[remote "origin"]` section can exist with its `url =` line absent -- any
    # checkout whose config was rewritten line-wise, for instance to strip an
    # embedded credential, ends up in that state -- and in it `git remote get-url
    # origin` does NOT fail: it prints the remote's NAME back and exits 0. Set it
    # explicitly here, in the untraced stage, so the recorded remote is correct
    # by construction.
    git remote set-url origin https://github.com/reproducible-ai/tacotron2.git \
      || git remote add origin https://github.com/reproducible-ai/tacotron2.git
    git remote -v
    test "$(git remote get-url origin)" = "https://github.com/reproducible-ai/tacotron2.git" \
      || { echo "origin is not the fork URL: $(git remote get-url origin)"; exit 1; }
    # ---- (a) provenance CLI: purge, install by version, verify by sha256 -----
    # P0-7: deleting only the .dist-info leaves an importable `roar/` package dir
    # behind, and a bare /usr/local/bin/roar has been caught importing it and
    # reporting a stale version. Purge package dirs, entrypoints and .pth files.
    # Never pipe rm into head: head exits, rm takes SIGPIPE and dies mid-list,
    # and it still reports success.
    sudo rm -rf /usr/local/lib/python3.10/dist-packages/roar_cli-*.dist-info \
                /usr/local/lib/python3.10/dist-packages/roar \
                /opt/pytorch/lib/python3.12/site-packages/roar_cli-*.dist-info \
                /opt/pytorch/lib/python3.12/site-packages/roar \
                /usr/local/bin/roar /usr/local/bin/roar-worker \
                /opt/pytorch/bin/roar /opt/pytorch/bin/roar-worker \
                /usr/local/lib/python3.10/dist-packages/roar_inject.pth \
                /opt/pytorch/lib/python3.12/site-packages/roar_inject.pth
    # `uv` is not on PATH on every campaign AMI (this stage runs as root and
    # /root/.local/bin is not always inherited), so make it explicit and
    # bootstrap it if the image lacks it. This stage is `trace: off`.
    export PATH=$PATH:/root/.local/bin:/usr/local/bin
    command -v uv >/dev/null || { curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh; }
    command -v uv
    # P0-14: install the CLI under the SAME interpreter the workload records, or
    # that interpreter's site-packages can shadow the recorded pins inside the
    # traced child and the run passes against host packages instead.
    RECORDED_PY="$(python -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')"
    echo "recorded interpreter: $RECORDED_PY"
    # `--index-strategy unsafe-best-match` is REQUIRED: uv gives an
    # --extra-index-url priority over the --index-url, so with the default
    # first-match strategy it finds roar-cli on the main index, never sees this
    # version, and dies with "no version of roar-cli==0.4.4rc6".
    # `--with huggingface-hub` is P0-19: the publish stage's `roar put ... hf://`
    # is what dies -- AFTER every traced step has succeeded -- if it is absent.
    # It lands in the CLI's own isolated venv, not the workload's, so it does not
    # touch the recorded environment.
    uv tool install --python "$RECORDED_PY" --force --with huggingface-hub \
        --index-strategy unsafe-best-match \
        --index-url https://test.pypi.org/simple/ \
        --extra-index-url https://pypi.org/simple/ \
        roar-cli==0.4.4rc6
    # P0-17: symlink it back onto PATH. The agent shells out to a bare `roar`
    # AFTER the run, without this stage's PATH; a row has had all stages succeed,
    # publish, and then be marked FAILED with "No such file or directory: 'roar'".
    sudo ln -sf "$(uv tool dir --bin 2>/dev/null || echo /root/.local/bin)/roar" /usr/local/bin/roar
    test "$(roar --version | grep -o '[0-9][^ ]*$')" = "0.4.4rc6" || \
      { echo "WRONG ROAR: $(roar --version)"; exit 1; }
    # A version string is not an identity: distinct builds have shipped under one
    # version string on this project before. Pin the artefact by wheel sha256 and
    # prove the installed files came from that wheel.
    ROAR_WHEEL_SCRATCH=/var/tmp python repro/verify_roar_wheel.py \
      --version 0.4.4rc6 \
      --sha256 c7115b748886259b6a089e547404376acf84c3b81b4cbc8dc5610490ebea7199 \
      --exe "$(command -v roar)"
    test "$(ls /usr/local/bin/../lib/python3.10/dist-packages/roar/bin 2>/dev/null | wc -l)" != "0" || \
      test "$(ls $(dirname $(readlink -f $(command -v roar)))/../lib/python*/site-packages/roar/bin | wc -l)" -ge 6 || \
      { echo "NO TRACER BINARIES"; exit 1; }
    roar --version
    # D16: PIN the tracer. `auto` resolves per host, so an unpinned row is traced
    # by a different tracer than the operator saw locally, invisibly. preload
    # needs no special permissions, so a visitor reproduces with the SAME tracer.
    roar tracer use preload
    roar tracer
    # ---- (b) this repository's dependencies, and why each ceiling exists -----
    # requirements.txt is from 2019 and pins matplotlib==2.1.0, tensorflow==1.15.2,
    # numpy==1.13.3, inflect==0.2.5, librosa==0.6.0, scipy==1.0.0,
    # Unidecode==1.0.22, pillow. Not one of those first seven installs on CPython
    # 3.12: they predate it by years and publish no wheels for it. So the row runs
    # upstream's code against modern releases -- but NOT the newest, because four
    # specific upstream lines stop working at four specific versions. Each ceiling
    # below is forced by a line of code, not by taste, and repro/preflight_cpu.py
    # asserts every one of them on CPU before this run spends a GPU-minute:
    #
    #   librosa==0.9.2    layers.py:50 calls librosa.filters.mel(sr, n_fft, n_mels,
    #                     fmin, fmax) POSITIONALLY and audio_processing.py:50 /
    #                     stft.py:67 call librosa.util.pad_center(x, size)
    #                     positionally. librosa 0.10 made all of those keyword-only:
    #                     TypeError on the first line of dataset construction.
    #                     0.9.2 is the last release that accepts them (FutureWarning).
    #   setuptools==79.0.1 librosa 0.9.2 does `from pkg_resources import
    #                     resource_filename` (librosa/util/files.py:10).
    #                     setuptools 84 REMOVED pkg_resources, so `import librosa`
    #                     dies with ModuleNotFoundError and nothing anywhere names
    #                     setuptools as the cause.
    #   numpy==1.26.4     plotting_utils.py:9 calls np.fromstring(..., sep='').
    #                     numpy 2.0 removed the binary mode of fromstring
    #                     ("ValueError: The binary mode of fromstring is removed").
    #                     That line runs inside logger.log_validation, i.e. at the
    #                     FIRST checkpoint -- so with numpy 2.x this row would train
    #                     correctly and then die on the validation pass. This is a
    #                     real, recorded downgrade from the image's numpy 2.4.4;
    #                     torch 2.7.0's numpy interop was verified against it.
    #   matplotlib==3.9.4 plotting_utils.py:9 also calls fig.canvas.tostring_rgb(),
    #                     REMOVED in matplotlib 3.10. Same code path, same timing.
    #   scipy==1.17.1     forced by numpy: scipy 1.18 requires numpy>=2.0.
    #
    # inflect, Unidecode and tensorboard are installed unpinned: upstream's pins
    # for the first two are from 2018 and unbuildable, the APIs this repository
    # uses (inflect.engine().number_to_words, unidecode()) are unchanged, and
    # tensorboard is what makes torch.utils.tensorboard's SummaryWriter work.
    # TENSORFLOW IS NOT INSTALLED. hparams.py imports it for exactly one symbol,
    # tf.contrib.training.HParams, deleted in TF 2.0 and never replaced; the
    # pinned tensorflow==1.15.2 has no wheel for any interpreter after 3.7.
    # repro/tf_hparams_shim.py supplies that container so upstream's hparams.py --
    # and therefore upstream's own epochs=500 default -- is read as published.
    python -m pip install --quiet \
      "numpy==1.26.4" "scipy==1.17.1" "librosa==0.9.2" "setuptools==79.0.1" \
      "matplotlib==3.9.4" inflect Unidecode tensorboard
    python -c "import torch, numpy, scipy, librosa, matplotlib; print('torch', torch.__version__, '| numpy', numpy.__version__, '| scipy', scipy.__version__, '| librosa', librosa.__version__, '| matplotlib', matplotlib.__version__)"
    python -c "import torch; print('cuda', torch.cuda.is_available(), '|', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU ONLY')"
    # ---- (c) pre-flight gates, before anything is paid for -------------------
    # The reproduction claim is "upstream's code, unmodified". Prove it by blob
    # hash rather than asserting it in prose. Upstream ships no .gitignore, so
    # this row expects ZERO declared exemptions -- including the three
    # filelists/*.txt, which upstream's README tells the reader to `sed` in place
    # and which this row instead satisfies by extracting the corpus into the
    # directory they already name.
    python repro/assert_upstream_unmodified.py
    # A `+cuNNN` local version or a PEP-503 duplicate makes the recorded freeze
    # un-installable from PyPI, so the lineage could never be rebuilt. Fail here
    # rather than at verification, after paying for the GPU.
    python repro/freeze_audit.py
    # Every 2019-era call listed at (b), executed for real on CPU. If a ceiling
    # above is wrong, this is where the run stops -- before the GPU is billed.
    python repro/preflight_cpu.py
    # librosa's stack is the pip-closure boundary this row was chosen to probe:
    # soundfile -> libsndfile, audioread, numba -> llvmlite -> LLVM. Print which
    # of the libraries actually mapped into the process come from a wheel, which
    # come from a dpkg package a pip freeze cannot express, and which belong to no
    # package manager at all. Diagnostic, never fatal.
    python repro/native_deps_probe.py || true
    # The publish stage uploads with this token; without it `roar put` fails
    # after every traced step has already succeeded. Value never printed.
    python -c "import os,sys; t=os.environ.get('HF_TOKEN') or ''; print('HF_TOKEN present in task env:', bool(t), '| length:', len(t)); sys.exit(0 if t else 1)"
    git status --porcelain
    roar init || true
  trace: off

# The corpus as its own traced step, so the 13100 wav files the training step
# reads resolve to files THIS step wrote -- an edge in the lineage graph instead
# of 13100 inputs from nowhere -- and so the fixed cost of a 2.6 GB download is
# separable from the variable cost of training when estimating a full run.
# --out-dir DUMMY is not a placeholder: `DUMMY/LJxxx-nnnn.wav` is the literal path
# in upstream's three filelists. Upstream's README says to `sed` those files;
# extracting into the directory they already name leaves them unmodified.
fetch_ljspeech:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n fetch_ljspeech -- python repro/fetch_ljspeech.py --out-dir DUMMY
  trace: off

# TRUNCATED: 101 optimiser steps. Upstream's hparams.py sets epochs=500 over a
# 12500-utterance filelist, which at this batch size is 390500 steps and days of
# single-GPU time. Both numbers that shorten it are upstream's own knobs passed
# through upstream's own --hparams flag; only --train-iters is this row's, and it
# is inside the recorded argv, so the lineage states the truncation on its face.
#
# batch_size=16 is a deviation from upstream's default of 64 and is a hardware
# fact, not a preference: Tacotron 2 unrolls a 1024-wide decoder LSTM over every
# mel frame of the longest clip in the batch, and 64 of those does not fit in a
# T4's 16 GB. iters_per_checkpoint=100 (upstream default 1000) exists because the
# checkpoint writer is inside the `iteration % iters_per_checkpoint == 0` branch:
# without it a 101-step run would finish having written no checkpoint at all and
# there would be no artefact to publish. It also forces two real validation
# passes over upstream's full 100-utterance validation filelist, at step 0 and
# step 100, which is what exercises logger.log_validation -- scalars, histograms
# and three matplotlib figures -- rather than leaving that path untested.
train:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n train -- python repro/train_truncated.py --train-iters 101 --dataloader-workers 0 --output_directory=outdir --log_directory=logdir --hparams=epochs=1,batch_size=16,iters_per_checkpoint=100
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact outdir/checkpoint_100 model.name=tacotron2-ljspeech model.version=1 license.id=BSD-3-Clause license.name='BSD 3-Clause License' description='Tacotron 2 (NVIDIA): character-to-mel-spectrogram sequence-to-sequence TTS with location-sensitive attention, trained on the LJ Speech corpus. TRUNCATED pipeline-viability run: 101 of 390500 optimiser steps, NOT converged.' documentation.url=https://github.com/NVIDIA/tacotron2/blob/master/README.md
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar put outdir/checkpoint_100 hf://reproducible-ai/tacotron2-ljspeech --public --yes --no-tag -m "Tacotron 2 trained on LJ Speech, 101 of 390500 optimiser steps (upstream hparams.py: 500 epochs). TRUNCATED pipeline-viability run: NOT converged and not a quality result."
  trace: off
